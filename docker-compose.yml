version: "3.9"

services:
  client:
    build: ./client
    image: sarang3333/craftdex-client2.0
    container_name: react-app
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
    networks:
      - fullstack-net

  server:
    build: ./server
    image: sarang3333/craftdex-server2.0
    container_name: server-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - fullstack-net
    environment:
      NODE_ENV: production

networks:
  fullstack-net:
    driver: bridge